input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
  }
}

filter {
  mutate {
    add_field => { "ingest" => "logstash" }
    add_tag => ["flask-app"]
  }
}

output {
  stdout { codec => rubydebug }
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "flask-logs-%{+YYYY.MM.dd}"
  }
}
