volumes:
  mongodb_data:

services:
  mongo_db:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/var/lib/mongo/data

  web:
    build:
      context: .
    depends_on:
      - mongo_db
    environment:
      MONGO_URI: ${MONGO_URI}
    ports:
      - "80:80"
    volumes:
      - .:/code
      - /code/__pycache__
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 80 --reload

